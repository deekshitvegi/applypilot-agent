<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApplyPilot</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="head-row">
      <button id="run" class="run">Start</button>
      <div class="head-text">
        <div id="activity" class="activity">Open a job page to begin</div>
        <div id="page-detail" class="sub"></div>
      </div>
      <button id="settings" class="icon" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
    <!-- With this on, the agent works through the steps itself. It still stops
         at anything required that it cannot answer, and it never presses final
         Submit unless that is set separately in Settings. -->
    <label class="switch" for="auto-continue">
      <input id="auto-continue" type="checkbox">
      <span class="track"><span class="knob"></span></span>
      <span class="switch-text">
        <strong>Fill and continue on its own</strong>
        <span id="auto-note" class="sub tiny">I will stop at anything I cannot answer.</span>
      </span>
    </label>
    <div id="progress" class="progress hidden"><div id="progress-bar"></div></div>
  </header>

  <div id="alerts"></div>

  <main>
    <!-- Setup owns the panel until the questions every form asks are answered. -->
    <section id="onboarding" class="card accent hidden">
      <div class="card-head">
        <h2>Set up your answers</h2>
        <span id="onboarding-progress" class="pill"></span>
      </div>
      <p id="onboarding-note" class="sub"></p>

      <label class="file-drop" for="resume-file">
        <span class="file-drop-title">Start from your r&eacute;sum&eacute;</span>
        <span class="sub">A .docx file. I take only what it says.</span>
        <input id="resume-file" type="file" accept=".docx" hidden>
      </label>
      <p id="resume-result" class="sub"></p>

      <div id="onboarding-step"></div>
      <button id="onboarding-later" class="link">Finish this later</button>
    </section>

    <!-- The one thing being asked, and nothing else competing with it. -->
    <section id="question" class="card accent hidden">
      <div class="card-head">
        <h2>I need one answer</h2>
        <span id="question-remaining" class="pill"></span>
      </div>
      <p id="question-label" class="ask"></p>
      <p id="question-reason" class="sub"></p>

      <div id="question-input"></div>
      <p id="question-hint" class="sub hint hidden"></p>

      <div class="actions">
        <button id="question-save" class="primary">Save &amp; next</button>
        <button id="question-skip" class="quiet">Skip</button>
        <button id="question-show" class="quiet">Find it</button>
      </div>
    </section>

    <section id="idle" class="card">
      <p id="idle-text" class="sub">Press Start on a job page and I will fill what I can.</p>
      <div class="actions">
        <button id="rescan" class="quiet">Rescan</button>
        <button id="fill" class="primary">Fill this page</button>
      </div>
    </section>

    <!-- What happened, grouped: what still wants you, and what is already done. -->
    <section id="review-card" class="card hidden">
      <h2 id="needs-heading">Needs you</h2>
      <ul id="needs-list" class="report"></ul>
    </section>

    <section id="done-card" class="card hidden">
      <button id="done-toggle" class="disclosure" aria-expanded="false">
        <span class="chev">&#9656;</span>
        <span id="done-heading">Completed</span>
      </button>
      <div id="done-body" class="hidden">
        <ul id="done-list" class="report"></ul>
        <p class="sub tiny">Press a row to answer it. Ones already filled scroll to the field instead.</p>
      </div>
    </section>

    <section class="card">
      <button id="log-toggle" class="disclosure" aria-expanded="false">
        <span class="chev">&#9656;</span>
        <span>Activity</span>
        <span id="log-badge" class="pill quiet-pill hidden"></span>
      </button>
      <div id="log" class="log hidden"></div>
      <form id="chat-form" class="chat">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Tell me what to change">
        <button type="submit" class="primary" id="chat-send">Send</button>
      </form>
      <p class="sub tiny">e.g. <em>state texas</em> &middot; <em>middle name Kumar</em> &middot; <em>change my last answer to No</em></p>
    </section>
  </main>

  <!-- One place to look for what happens next. -->
  <div class="cta-bar">
    <button id="cta" class="primary cta">Fill this page</button>
    <p id="cta-note" class="sub tiny"></p>
  </div>

  <footer>
    <span id="versions"></span>
    <span id="applications" class="sub"></span>
  </footer>

  <script src="placeholders.js"></script>
  <script src="theme.js"></script>
  <script src="cta.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
