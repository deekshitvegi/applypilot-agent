[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot"
version = "1.35.0"
description = "Local-first job application agent: a Chrome side panel plus a service on 127.0.0.1 that fills applications and verifies every value from page-owned state."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deekshitth Vegi" }]
keywords = ["job-application", "automation", "chrome-extension", "ats"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "cryptography>=42.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "playwright>=1.45",
    "ruff>=0.16,<1",
]

[project.scripts]
applypilot = "applypilot.__main__:main"

[project.urls]
Homepage = "https://github.com/deekshitvegi/applypilot-agent"
Source = "https://github.com/deekshitvegi/applypilot-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
applypilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: drives real injected extension functions in headless Chromium (needs playwright install chromium)",
    "live: hits real employer sites over the network",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default argument.
    "B008",
    # Ternaries are not always clearer than a short if/else block.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
