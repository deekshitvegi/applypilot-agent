<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Career Opportunities: AI Agent ML Engineer</title>
    <style>
      main { width: 560px; margin: 24px; font-family: sans-serif; }
      label { display: block; margin: 10px 0 3px; }
      input { width: 320px; padding: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Career Opportunities: AI Agent ML Engineer (18304)</h1>
      <p>Already a registered user? <a href="/signin">Please sign in</a></p>
      <!--
        A NEW account, not a sign-in: two password fields and a confirming
        email. Waiting for a password manager here stalls forever, because the
        account does not exist yet.
      -->
      <form id="registration">
        <label for="email">Email Address:</label>
        <input id="email" name="email" type="text" />
        <label for="email2">Retype Email Address:</label>
        <input id="email2" name="retypeEmail" type="text" />
        <label for="pw">Choose Password:</label>
        <input id="pw" name="password" type="password" />
        <label for="pw2">Retype Password:</label>
        <input id="pw2" name="retypePassword" type="password" />
        <label for="first">First Name:</label>
        <input id="first" name="firstName" type="text" />
        <button type="submit">Create Account</button>
      </form>
    </main>
  </body>
</html>
