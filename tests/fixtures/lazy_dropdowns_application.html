<!doctype html>
<meta charset="utf-8">
<title>Application Questions</title>
<!--
  Built from a real application that went wrong.

  Its dropdowns hold nothing until they are touched, so a scan saw a required
  choice with no choices in it -- and the panel handed back a text box asking
  the applicant to type a dropdown answer. Options have to be opened and read
  before anyone is asked anything.

  It also asks for the current date, which is not a question for a person, and
  labels its fields with trailing colons and doubled asterisks.
-->
<main>
  <h3>APPLICATION QUESTIONS</h3>

  <div class="row">
    <label for="hear">How did you hear about this opportunity?*</label>
    <select id="hear" name="hear"><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="src">Source</label>
    <select id="src" name="source"><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="srcother">If source is not listed, enter here</label>
    <input id="srcother" name="source_other">
  </div>

  <div class="row">
    <label for="auth">Are you legally authorized to work in the United States?*</label>
    <select id="auth" name="auth" required><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="spon">Do you now or will you in the future require company sponsorship for a visa or employment authorization?*</label>
    <select id="spon" name="spon" required><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="visastatus">If yes, please indicate Visa status</label>
    <input id="visastatus" name="visa_status">
  </div>

  <div class="row">
    <label for="rel">Do you have relatives employed by the company or any affiliates?*</label>
    <select id="rel" name="relatives" required><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="reldept">If yes, what department and what country?</label>
    <input id="reldept" name="rel_dept">
  </div>

  <div class="row">
    <label for="noncompete">Are you under any non-compete agreement with a former or current employer?*</label>
    <select id="noncompete" name="noncompete" required><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="salary">What are your salary expectations? (include currency)</label>
    <input id="salary" name="salary">
  </div>

  <div class="row">
    <label for="country">Country/Region of Residence:* *</label>
    <select id="country" name="countryOfResidence" required><option value="">No Selection</option></select>
  </div>

  <div class="row">
    <label for="fullname">Full Name</label>
    <input id="fullname" name="fullName">
  </div>

  <div class="row">
    <label for="today">Current Date</label>
    <input id="today" name="currentDate" placeholder="MM/DD/YYYY">
  </div>

  <div class="row">
    <label for="dob">Date of Birth</label>
    <input id="dob" name="dob" placeholder="MM/DD/YYYY">
  </div>

  <div class="row">
    <label for="notification">Notification:</label>
    <select id="notification" name="notification"><option value="">No Selection</option></select>
  </div>

  <button type="button">Submit Application</button>
</main>

<script>
  // The options a real form of this shape loads only once the control is
  // touched. Before that the scan sees a required dropdown with nothing in it.
  const LISTS = {
    hear: ["LinkedIn", "Indeed", "Referral", "Company Website", "Job Fair", "Other"],
    source: ["LinkedIn", "Indeed", "Glassdoor", "Other"],
    auth: ["Yes", "No"],
    spon: ["Yes", "No"],
    relatives: ["Yes", "No"],
    noncompete: ["Yes", "No"],
    countryOfResidence: ["United States", "United States Minor Outlying Islands", "Canada", "India"],
    notification: ["Email", "Phone"],
  };
  for (const select of document.querySelectorAll("select")) {
    const fill = () => {
      if (select.options.length > 1) return;
      for (const label of LISTS[select.name] || []) {
        const option = document.createElement("option");
        option.value = label;
        option.textContent = label;
        select.appendChild(option);
      }
    };
    select.addEventListener("pointerdown", fill);
    select.addEventListener("focus", fill);
    select.addEventListener("mousedown", fill);
  }
</script>
