<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Multi-select checkbox groups</title>
    <style>
      main { width: 640px; margin: 24px; font-family: sans-serif; }
      fieldset { border: 0; margin: 0 0 20px; padding: 0; }
      label { display: block; padding: 4px 0; }
    </style>
  </head>
  <body>
    <main>
      <fieldset>
        <legend>Which CI tools do you have hands-on experience with?</legend>
        <label><input type="checkbox" name="tools" value="GitHub CI" /> GitHub CI</label>
        <label><input type="checkbox" name="tools" value="CircleCI" /> CircleCI</label>
        <label><input type="checkbox" name="tools" value="Jenkins" /> Jenkins</label>
      </fieldset>
      <fieldset>
        <legend>Which locations are you open to relocating to?</legend>
        <label><input type="checkbox" name="locations" value="Chicago, IL" /> Chicago, IL</label>
        <label><input type="checkbox" name="locations" value="New York, NY" /> New York, NY</label>
        <label><input type="checkbox" name="locations" value="Unable to relocate" /> Unable to relocate</label>
      </fieldset>
    </main>
  </body>
</html>
