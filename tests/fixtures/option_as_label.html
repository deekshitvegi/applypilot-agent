<!doctype html>
<meta charset="utf-8">
<title>Custom questions with the answer inside the label</title>
<!--
  Copied from the real markup, not invented. Each radio sits inside its own
  <label>, and the word "Yes" lives in a span in there with it. The question
  itself is a sibling of the block holding the choices, one level further out.

  This is the shape that made every Yes/No question on a real application come
  back labelled "Yes": the span is short, visible and holds no control, so a
  search for the question inside the block found it first.
-->
<form>
  <ul class="application-questions">
    <li class="application-question custom-question">
      <div>
        <div class="application-label">
          Are you legally authorized to work in the country for which you are applying?<span class="required">✱</span>
        </div>
        <div class="application-field full-width required-field">
          <ul>
            <li>
              <label>
                <input type="radio" name="cards[abc][field0]" value="Yes" required>
                <span class="application-answer-alternative">Yes</span>
              </label>
            </li>
            <li>
              <label>
                <input type="radio" name="cards[abc][field0]" value="No" required>
                <span class="application-answer-alternative">No</span>
              </label>
            </li>
          </ul>
        </div>
      </div>
    </li>

    <li class="application-question custom-question">
      <div>
        <div class="application-label">
          Will you now or in the future require sponsorship for employment visa status?<span class="required">✱</span>
        </div>
        <div class="application-field full-width required-field">
          <ul>
            <li>
              <label>
                <input type="radio" name="cards[abc][field1]" value="Yes" required>
                <span class="application-answer-alternative">Yes</span>
              </label>
            </li>
            <li>
              <label>
                <input type="radio" name="cards[abc][field1]" value="No" required>
                <span class="application-answer-alternative">No</span>
              </label>
            </li>
          </ul>
        </div>
      </div>
    </li>
  </ul>

  <label for="email">Email</label>
  <input id="email" type="email" name="email" required>
  <button type="submit">Submit application</button>
</form>
