<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Careers - Complete your application</title>
    <style>
      main { width: 560px; margin: 24px; font-family: sans-serif; }
      label { display: block; margin: 10px 0 4px; }
      input, select { width: 320px; padding: 6px; }
    </style>
  </head>
  <body>
    <main>
      <!--
        The filename deliberately contains "postLogin", exactly as the live
        ADP application URL does. An application form must never be mistaken
        for a sign-in page just because its URL contains "login" and it asks
        for an email address.
      -->
      <form id="application">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" />

        <label for="mobile">Mobile Number</label>
        <input id="mobile" name="mobilePhone" type="tel" />

        <label for="home">Home Phone Number</label>
        <input id="home" name="homePhone" type="tel" />

        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select...</option>
          <option value="US">United States</option>
        </select>

        <label for="addr1">Address Line 1</label>
        <input id="addr1" name="addressLine1" type="text" />

        <label for="city">City</label>
        <input id="city" name="city" type="text" />

        <label for="zip">Zip Code</label>
        <input id="zip" name="postalCode" type="text" />

        <button type="button">Next</button>
      </form>
    </main>
  </body>
</html>
