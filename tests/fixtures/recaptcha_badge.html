<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Application form with an invisible reCAPTCHA badge</title>
    <style>
      main { width: 640px; margin: 24px; font-family: sans-serif; }
      .grecaptcha-badge {
        position: fixed; bottom: 14px; right: 14px;
        width: 256px; height: 60px; overflow: hidden;
      }
      label { display: block; margin: 10px 0 4px; }
      input[type="text"], input[type="email"] { width: 320px; padding: 6px; }
    </style>
  </head>
  <body>
    <main>
      <form id="application">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label for="resume">Resume</label>
        <input id="resume" name="resume" type="file" />
        <button type="button">Apply</button>
      </form>
    </main>
    <!-- Invisible reCAPTCHA v3: the badge is visible but requires no action. -->
    <div class="grecaptcha-badge">
      <iframe
        title="reCAPTCHA"
        src="https://www.google.com/recaptcha/api2/anchor?k=demo&amp;size=invisible"
        width="256" height="60"></iframe>
    </div>
  </body>
</html>
