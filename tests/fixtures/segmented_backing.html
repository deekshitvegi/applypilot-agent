<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Segmented Yes/No with hidden backing checkbox</title>
    <style>
      main { width: 640px; margin: 24px; font-family: sans-serif; }
      .segmented { display: flex; gap: 8px; }
      .segmented button { padding: 10px 24px; }
      .segmented button[data-state="on"] { border: 2px solid #2563eb; }
      .backing { position: absolute; width: 0; height: 0; opacity: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="question-block" id="sponsorship-block">
        <p class="question">Will you now or in the future require sponsorship?</p>
        <div class="segmented">
          <button type="button">Yes</button>
          <button type="button">No</button>
          <input class="backing" type="checkbox" name="sponsorship_backing" />
        </div>
      </div>
    </main>
    <script>
      window.__clicks = { yes: 0, no: 0 };
      const block = document.querySelector("#sponsorship-block");
      const backing = block.querySelector("input[type=checkbox]");
      block.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          const label = button.textContent.trim().toLowerCase();
          window.__clicks[label] += 1;
          block.querySelectorAll("button").forEach((sibling) => {
            sibling.setAttribute("data-state", sibling === button ? "on" : "off");
          });
          backing.checked = label === "yes";
        });
      });
    </script>
  </body>
</html>
