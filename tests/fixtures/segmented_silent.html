<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Segmented Yes/No with no observable state</title>
    <style>
      main { width: 640px; margin: 24px; font-family: sans-serif; }
      .segmented { display: flex; gap: 8px; }
      .segmented button { padding: 10px 24px; }
    </style>
  </head>
  <body>
    <main>
      <div class="question-block">
        <p class="question">Have you reviewed the background check policy?</p>
        <div class="segmented">
          <button type="button">Yes</button>
          <button type="button">No</button>
        </div>
      </div>
    </main>
    <script>
      // This page intentionally records the selection only in JavaScript
      // memory. Nothing in the DOM changes, so no click can be verified.
      window.__selected = "";
      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          window.__selected = button.textContent.trim();
        });
      });
    </script>
  </body>
</html>
