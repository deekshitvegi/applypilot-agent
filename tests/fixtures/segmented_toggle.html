<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pressed buttons that toggle off on a second click</title>
    <style>
      main { width: 640px; margin: 24px; font-family: sans-serif; }
      .segmented { display: flex; gap: 8px; }
      .segmented button { padding: 10px 24px; }
      .segmented button[aria-pressed="true"] { border: 2px solid #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <div class="question-block">
        <p class="question">Are you legally authorized to work in the United States?</p>
        <div class="segmented">
          <button type="button" aria-pressed="false">Yes</button>
          <button type="button" aria-pressed="false">No</button>
        </div>
      </div>
    </main>
    <script>
      window.__clicks = { yes: 0, no: 0 };
      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          window.__clicks[button.textContent.trim().toLowerCase()] += 1;
          const pressed = button.getAttribute("aria-pressed") === "true";
          // A second click on the same button clears the selection.
          document.querySelectorAll("button").forEach((sibling) => {
            sibling.setAttribute("aria-pressed", "false");
          });
          button.setAttribute("aria-pressed", pressed ? "false" : "true");
        });
      });
    </script>
  </body>
</html>
