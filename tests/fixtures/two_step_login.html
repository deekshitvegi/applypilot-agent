<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in | WFNPortal</title>
    <style>
      main { width: 420px; margin: 40px auto; font-family: sans-serif; }
      input[type="text"] { width: 320px; padding: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <!-- A two-step sign-in: the password is only requested on the next
           screen, so there is no password input to detect here. -->
      <label for="uid">User ID</label>
      <input id="uid" name="loginfmt" type="text" autocomplete="off" />
      <label><input type="checkbox" name="remember" /> Remember user ID</label>
      <button type="submit">Next</button>
    </main>
  </body>
</html>
