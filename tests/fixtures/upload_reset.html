<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>File upload resets another answer</title>
    <style>
      main { width: 640px; margin: 24px; font-family: sans-serif; }
      fieldset { border: 0; margin: 0 0 20px; padding: 0; }
      label { display: block; padding: 4px 0; }
    </style>
  </head>
  <body>
    <main>
      <fieldset id="sponsorship-group">
        <legend>Will you now or in the future require sponsorship?</legend>
        <label><input type="radio" name="sponsorship" value="Yes" /> Yes</label>
        <label><input type="radio" name="sponsorship" value="No" /> No</label>
      </fieldset>
      <label>
        Résumé
        <input type="file" name="resume" />
      </label>
    </main>
    <script>
      // Simulates a reactive ATS that resets earlier answers when a file is
      // attached, which is a reproduction of the live Ashby behavior.
      document.querySelector("input[type=file]").addEventListener("change", () => {
        document.querySelectorAll("input[type=radio]").forEach((radio) => {
          radio.checked = false;
        });
      });
    </script>
  </body>
</html>
